<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Boss Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0d0b09; overflow: hidden; touch-action: none;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { filter: sepia(0.18) contrast(1.06) saturate(1.1); touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ================= setup =================
const W = 960, H = 540, GROUND = 470;
const PLATS = [{ x: 70, y: 360, w: 180 }, { x: 340, y: 270, w: 170 }];
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
let touchUI = matchMedia('(pointer: coarse)').matches;
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();

const THEMES = {
  fire:      { c: ['#ff5a1f', '#ffd23f'], sky: ['#ffcf8a', '#d9480f'], hills: ['#9a3412', '#4a1505'], amb: 'ember' },
  ice:       { c: ['#38bdf8', '#e0f7ff'], sky: ['#f0f9ff', '#7dd3fc'], hills: ['#7c93ad', '#3b4d63'], amb: 'snow' },
  poison:    { c: ['#65d035', '#e2ffb0'], sky: ['#e6f7b0', '#5b8a12'], hills: ['#3f6212', '#1c2e06'], amb: 'spore' },
  shadow:    { c: ['#a259ff', '#f0d9ff'], sky: ['#5b2aa8', '#1a1440'], hills: ['#2e1065', '#0e0826'], amb: 'wisp' },
  lightning: { c: ['#ffd000', '#ffffff'], sky: ['#64748b', '#0f172a'], hills: ['#253246', '#060b16'], amb: 'rain' },
  chaos:     { c: ['#ff2e88', '#ffe1f0'], sky: ['#ffd6ec', '#c0266d'], hills: ['#8a1c50', '#46081f'], amb: 'spark' },
};
const PINK = '#ff6ec7';
const FONT = '"Luckiest Guy", Impact, sans-serif';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
const hexA = (c, a) => c + Math.round(a * 255).toString(16).padStart(2, '0');
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const inRect = (p, r) => p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h;
const circleRect = (x, y, r, b) => Math.hypot(clamp(x, b.x, b.x + b.w) - x, clamp(y, b.y, b.y + b.h) - y) < r;

// ================= state =================
let bosses = [], queue = [], loop = 0, wins = 0, best = 0;
let state = 'loading', stateT = 0, T = 0;
let shake = 0, hitstop = 0, flashA = 0, flashColor = '#fff', banner = null;
let player = null, boss = null, theme = THEMES.chaos;
let pShots = [], eShots = [], minions = [], particles = [], ambient = [], clouds = [];
try { best = +localStorage.getItem('bossrush-best') || 0; } catch {}

const PLAY_BTN = { x: W / 2 - 120, y: 290, w: 240, h: 76 };
const RETRY_BTN = { x: W / 2 - 250, y: 390, w: 230, h: 64 };
const MENU_BTN = { x: W / 2 + 20, y: 390, w: 230, h: 64 };

// ================= input =================
const keys = {};
let mouseDown = false;
const KEYMAP = { Space: 'jump', KeyK: 'jump', KeyZ: 'jump', ShiftLeft: 'dash', ShiftRight: 'dash', KeyL: 'dash',
  KeyE: 'ex', KeyI: 'ex', KeyF: 'super', KeyO: 'super', KeyQ: 'swap', KeyU: 'swap', KeyS: 'down', ArrowDown: 'down' };
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  if (state === 'menu' && (e.code === 'Enter' || e.code === 'Space')) return startRun();
  if (state === 'dead' && stateT > 0.8) { if (e.code === 'Enter' || e.code === 'Space') return retry(); if (e.code === 'Escape') return toMenu(); }
  if (state === 'intro' && e.code === 'Enter' && stateT > 1) { stateT = Math.max(stateT, 2.6); return; }
  if (KEYMAP[e.code]) action(KEYMAP[e.code]);
});
addEventListener('keyup', e => { keys[e.code] = false; if (KEYMAP[e.code] === 'jump') releaseJump(); });

function toGame(cx, cy) { const r = cv.getBoundingClientRect(); return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; mouseDown = true; tap(toGame(e.clientX, e.clientY)); });
addEventListener('pointerup', e => { if (e.pointerType === 'mouse') mouseDown = false; });

// ---- touch controls (shown automatically on phones/tablets) ----
const BTNS = [
  { a: 'jump', x: W - 82, y: H - 82, r: 54, label: 'JUMP' },
  { a: 'dash', x: W - 196, y: H - 56, r: 38, label: 'DASH' },
  { a: 'ex', x: W - 80, y: H - 200, r: 36, label: 'EX' },
  { a: 'swap', x: W - 186, y: H - 164, r: 30, label: 'GUN' },
  { a: 'super', x: W - 298, y: H - 56, r: 38, label: 'SUPER', show: () => player && player.meter >= 5 },
];
const touch = { stick: null, held: {} };
function goFullscreen() {
  const el = document.documentElement;
  if (document.fullscreenElement || !el.requestFullscreen) return;
  el.requestFullscreen().then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
}
addEventListener('touchstart', e => {
  e.preventDefault();
  touchUI = true;
  goFullscreen();
  for (const t of e.changedTouches) {
    const p = toGame(t.clientX, t.clientY);
    if (state !== 'fight') { tap(p); continue; }
    const b = BTNS.find(b => (!b.show || b.show()) && Math.hypot(p.x - b.x, p.y - b.y) < b.r + 16);
    if (b) { touch.held[t.identifier] = b; b.down = true; action(b.a); }
    else if (p.x < W * 0.5 && !touch.stick) touch.stick = { id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y, downSent: false };
  }
}, { passive: false });
addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const s = touch.stick;
    if (!s || s.id !== t.identifier) continue;
    const p = toGame(t.clientX, t.clientY);
    const dx = p.x - s.ox, dy = p.y - s.oy, d = Math.hypot(dx, dy);
    if (d > 70) { s.ox = p.x - dx / d * 70; s.oy = p.y - dy / d * 70; } // base follows the thumb
    s.x = p.x; s.y = p.y;
    const ny = (s.y - s.oy) / 55;
    if (ny > 0.6 && !s.downSent) { s.downSent = true; action('down'); }
    if (ny < 0.4) s.downSent = false;
  }
}, { passive: false });
function endTouch(e) {
  for (const t of e.changedTouches) {
    if (touch.stick && touch.stick.id === t.identifier) touch.stick = null;
    const b = touch.held[t.identifier];
    if (b) { b.down = false; if (b.a === 'jump') releaseJump(); delete touch.held[t.identifier]; }
  }
}
addEventListener('touchend', endTouch);
addEventListener('touchcancel', endTouch);

function moveX() {
  let d = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  if (touch.stick) { const dx = (touch.stick.x - touch.stick.ox) / 55; if (Math.abs(dx) > 0.3) d = Math.sign(dx); }
  return d;
}
const aimUp = () => keys.KeyW || keys.ArrowUp || (touch.stick && (touch.stick.y - touch.stick.oy) / 55 < -0.5);
const shooting = () => keys.KeyJ || keys.KeyX || mouseDown || touchUI; // auto-fire on touch screens

function tap(p) {
  if (state === 'menu') { if (inRect(p, PLAY_BTN)) startRun(); }
  else if (state === 'dead' && stateT > 0.8) { if (inRect(p, RETRY_BTN)) retry(); else if (inRect(p, MENU_BTN)) toMenu(); }
  else if (state === 'intro' && stateT > 1) stateT = Math.max(stateT, 2.6);
}

// ================= assets =================
function tintCanvas(src, color) {
  const c = mk(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return c;
}
function makeSprite(img, element) {
  let w = 240, h = 260;
  if (img) { const s = Math.min(300 / img.width, 330 / img.height); w = img.width * s; h = img.height * s; }
  const sprite = mk(w, h), g = sprite.getContext('2d');
  if (img) g.drawImage(img, 0, 0, sprite.width, sprite.height);
  else {
    g.fillStyle = '#e9b872'; g.strokeStyle = '#000'; g.lineWidth = 6;
    g.beginPath(); g.ellipse(w / 2, h / 2, w / 2 - 6, h / 2 - 6, 0, 0, 7); g.fill(); g.stroke();
    g.fillStyle = '#000'; g.fillRect(w * 0.3, h * 0.35, 22, 30); g.fillRect(w * 0.6, h * 0.35, 22, 30); g.fillRect(w * 0.35, h * 0.68, w * 0.3, 12);
  }
  const th = THEMES[element] || THEMES.chaos;
  return { sprite, w: sprite.width, h: sprite.height, flash: tintCanvas(sprite, '#ffffff'), tint: tintCanvas(sprite, th.c[0]),
           red: tintCanvas(sprite, '#ff1a1a'), dark: tintCanvas(sprite, '#000000') };
}
const glowCache = {};
function glowSprite(color) {
  if (!glowCache[color]) {
    const c = mk(64, 64), g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, hexA(color, 1)); gr.addColorStop(0.35, hexA(color, 0.45)); gr.addColorStop(1, hexA(color, 0));
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); glowCache[color] = c;
  }
  return glowCache[color];
}
function drawGlow(x, y, r, color, a = 1) {
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = clamp(a, 0, 1);
  ctx.drawImage(glowSprite(color), x - r, y - r, r * 2, r * 2);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

async function loadBosses() {
  let list = [];
  try { list = await (await fetch('bosses/index.json', { cache: 'no-store' })).json(); } catch {}
  const loaded = await Promise.all(list.map(b => new Promise(res => {
    const img = new Image();
    img.onload = () => res({ ...b, ...makeSprite(img, b.element) });
    img.onerror = () => res(null);
    img.src = 'bosses/' + b.image;
  })));
  bosses = loaded.filter(Boolean);
  if (!bosses.length) bosses = [{ name: 'Placeholder Pete', title: 'Guardian of the Empty Folder', taunt: 'Put some photos in ~/skyphot!', element: 'chaos', ...makeSprite(null, 'chaos') }];
}

// ---- stage art (re-painted per boss element) ----
const skyC = mk(W, GROUND), hillsC = mk(W + 80, GROUND), groundC = mk(W, H - GROUND), vignC = mk(W, H);
(function paintVignette() {
  const g = vignC.getContext('2d'), v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(25,12,0,0.6)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
})();
function paintStage(th) {
  let g = skyC.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, GROUND); sky.addColorStop(0, th.sky[0]); sky.addColorStop(1, th.sky[1]);
  g.fillStyle = sky; g.fillRect(0, 0, W, GROUND);
  const sun = g.createRadialGradient(190, 110, 10, 190, 110, 150);
  sun.addColorStop(0, 'rgba(255,255,240,0.95)'); sun.addColorStop(0.25, 'rgba(255,250,220,0.5)'); sun.addColorStop(1, 'rgba(255,240,200,0)');
  g.fillStyle = sun; g.fillRect(0, 0, W, GROUND);
  g.fillStyle = hexA(th.hills[0], 0.45); g.beginPath(); g.moveTo(0, GROUND);
  for (let x = 0, i = 0; x <= W + 60; x += 60, i++) g.lineTo(x, 250 + ((i * 37) % 5) * 22 + (i % 2) * 40);
  g.lineTo(W, GROUND); g.fill();

  g = hillsC.getContext('2d'); g.clearRect(0, 0, hillsC.width, GROUND);
  [[th.hills[0], 355, 38, 0.007], [th.hills[1], 405, 26, 0.013]].forEach(([c, base, amp, f], li) => {
    g.fillStyle = c; g.beginPath(); g.moveTo(0, GROUND);
    for (let x = 0; x <= hillsC.width; x += 6) g.lineTo(x, base + Math.sin(x * f + li * 2) * amp);
    g.lineTo(hillsC.width, GROUND); g.fill();
    for (let x = 30 + li * 50; x < hillsC.width; x += 110 + li * 40) { // little trees
      const y = base + Math.sin(x * f + li * 2) * amp;
      g.beginPath(); g.moveTo(x - 14, y + 4); g.lineTo(x, y - 34 - li * 6); g.lineTo(x + 14, y + 4); g.fill();
    }
  });

  g = groundC.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, H - GROUND); gr.addColorStop(0, '#6b4423'); gr.addColorStop(1, '#2e1c0e');
  g.fillStyle = gr; g.fillRect(0, 0, W, H - GROUND);
  g.fillStyle = 'rgba(0,0,0,0.25)';
  for (let i = 0; i < 70; i++) g.fillRect(rand(0, W), rand(14, H - GROUND), rand(8, 26), rand(3, 6));
  g.fillStyle = th.hills[0]; g.fillRect(0, 0, W, 8);
  g.strokeStyle = '#000'; g.lineWidth = 4; g.beginPath(); g.moveTo(0, 1); g.lineTo(W, 1); g.stroke();

  clouds = Array.from({ length: 5 }, (_, i) => ({ x: rand(0, W), y: rand(40, 190), s: rand(0.6, 1.3), v: rand(8, 22) }));
  ambient = Array.from({ length: 50 }, () => newAmb(th.amb, true));
}
function newAmb(type, anywhere) {
  const up = type === 'ember' || type === 'spore';
  return { x: rand(0, W), y: anywhere ? rand(0, GROUND) : (up ? GROUND + 5 : -10), s: rand(1, 3), ph: rand(0, 7) };
}
function updateAmbient(dt) {
  const type = theme.amb;
  for (const a of ambient) {
    if (type === 'ember') { a.y -= (35 + a.s * 25) * dt; a.x += Math.sin(T * 2 + a.ph) * 25 * dt; }
    else if (type === 'snow') { a.y += (30 + a.s * 18) * dt; a.x += Math.sin(T + a.ph) * 20 * dt; }
    else if (type === 'spore') { a.y -= (8 + a.s * 6) * dt; a.x += Math.sin(T * 0.8 + a.ph) * 14 * dt; }
    else if (type === 'wisp') { a.y += Math.sin(T * 1.3 + a.ph) * 18 * dt; a.x += Math.cos(T * 0.7 + a.ph) * 22 * dt; }
    else if (type === 'rain') { a.x -= 220 * dt; a.y += 950 * dt; }
    else { a.x += Math.sin(T + a.ph) * 10 * dt; }
    if (a.y < -20 || a.y > GROUND + 10 || a.x < -30 || a.x > W + 30) Object.assign(a, newAmb(type, type === 'wisp' || type === 'spark'), type === 'rain' ? { y: -10, x: rand(0, W + 200) } : {});
  }
  for (const c of clouds) { c.x += c.v * dt; if (c.x > W + 150) c.x = -150; }
  if (type === 'rain' && Math.random() < dt * 0.12) { flashA = 0.35; flashColor = '#dbeafe'; }
}

// ================= run / boss setup =================
async function startRun() {
  state = 'loading';
  await loadBosses();
  wins = 0; loop = 0; queue = shuffle(bosses);
  nextBoss();
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toMenu() { state = 'menu'; stateT = 0; }
function retry() { setupBoss(boss.data); }
function nextBoss() { if (!queue.length) { loop++; queue = shuffle(bosses); } setupBoss(queue.shift()); }

function resetPlayer() {
  player = { x: 120, y: GROUND - 56, w: 30, h: 56, vx: 0, vy: 0, face: 1, hp: 3, inv: 0, onGround: true, jumps: 0,
             dashT: 0, dashCd: 0, shootCd: 0, jumpBuf: 0, coyote: 0, drop: 0, anim: 0, meter: 0, weapon: 0,
             superT: 0, exCd: 0, muzzle: 0, spin: 0, parryWin: 0, hurtFlash: 0, after: [], blink: 2 };
}
function setupBoss(data) {
  theme = THEMES[data.element] || THEMES.chaos;
  paintStage(theme);
  const lvl = wins, maxHp = Math.round(320 * (1 + lvl * 0.22 + loop * 0.5));
  const homeX = W - 40 - data.w / 2;
  boss = { data, lvl, w: data.w, h: data.h, x: homeX, homeX, lift: H + 200, introVy: 0, landed: false,
           hp: maxHp, maxHp, phase: 1, t: 0, flash: 0, hitJ: 0, atk: null, atkT: 0, prevT: 0, st: {}, cd: 1.2, last: null,
           pose: { lean: 0, sx: 1, sy: 1, glow: 0.2, wob: 0 }, tp: { lean: 0, sx: 1, sy: 1, glow: 0.2, wob: 0 },
           shake: 0, roar: 0, invuln: true, trail: false, after: [], dashWarn: 0, shattered: false };
  resetPlayer(); pShots = []; eShots = []; minions = []; banner = null;
  state = 'intro'; stateT = 0;
}

// ================= particles =================
function part(o) { const p = { x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 0.5, size: 4, color: '#fff', kind: 'spark', ...o }; p.max = p.life; particles.push(p); return p; }
function sparks(x, y, colors, n, spd = 300, life = 0.5) {
  for (let i = 0; i < n; i++) { const a = rand(0, 7), s = rand(0.2, 1) * spd;
    part({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 300, life: rand(0.5, 1) * life, size: rand(3, 6), color: colors[i % colors.length] }); }
}
function bits(x, y, colors, n, spd = 350) {
  for (let i = 0; i < n; i++) { const a = rand(0, 7), s = rand(0.3, 1) * spd;
    part({ kind: 'bit', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 150, g: 900, life: rand(0.4, 0.9), size: rand(4, 8), color: colors[i % colors.length] }); }
}
function dust(x, y, n = 6, spread = 30) {
  for (let i = 0; i < n; i++) part({ kind: 'dust', x: x + rand(-spread, spread), y: y - rand(0, 10), vx: rand(-60, 60), vy: rand(-60, -10), life: rand(0.4, 0.8), size: rand(8, 16), color: '#d8c3a5' });
}
function ring(x, y, color, size, life = 0.4) { part({ kind: 'ring', x, y, life, size, color }); }
function popup(text, x, y, color = '#fff', size = 34) { part({ kind: 'text', text, x, y, vy: -60, life: 0.9, size, color }); }
function updateParticles(dt) {
  for (const p of particles) {
    p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.vr) p.rot += p.vr * dt;
    if (p.kind === 'chunk' && p.y > GROUND - p.sh / 2 && p.vy > 0) { p.y = GROUND - p.sh / 2; p.vy *= -0.35; p.vx *= 0.7; p.vr *= 0.6; }
  }
  particles = particles.filter(p => p.life > 0);
  if (particles.length > 700) particles.splice(0, particles.length - 700);
}

// ================= player =================
const WEAPONS = [
  { name: 'PEASHOOTER', rate: 0.1, fire: (o, a) => shot(o, a, 1000, 1, { size: 6 }) },
  { name: 'SPREAD', rate: 0.17, fire: (o, a) => { for (let i = -2; i <= 2; i++) shot(o, a + i * 0.13, 900, 0.8, { life: 0.3, size: 5, color: '#ffb703' }); } },
  { name: 'CHASER', rate: 0.13, fire: (o, a) => shot(o, a, 640, 0.55, { homing: true, life: 2, size: 5, color: '#90f1a8' }) },
];
function shot(o, a, spd, dmg, opt = {}) {
  pShots.push({ x: o.x, y: o.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, dmg, life: 1.5, size: 6, color: '#7fd7ff', ...opt });
}
function aimAngle() {
  const p = player, d = moveX();
  if (aimUp()) return d > 0 ? -Math.PI / 4 : d < 0 ? -3 * Math.PI / 4 : -Math.PI / 2;
  return p.face > 0 ? 0 : Math.PI;
}
function gunPos(a) { const p = player; return { x: p.x + p.w / 2 + Math.cos(a) * 26, y: p.y + 28 + Math.sin(a) * 22 }; }
const pc = () => ({ x: player.x + player.w / 2, y: player.y + player.h / 2 });

function action(a) {
  if (state !== 'fight' || !player || player.superT > 0) return;
  const p = player;
  if (a === 'jump') tryJump();
  else if (a === 'dash' && p.dashCd <= 0) {
    const d = moveX(); if (d) p.face = d;
    p.dashT = 0.2; p.dashCd = 0.55; dust(p.x + p.w / 2, p.y + p.h, 5, 10);
  }
  else if (a === 'down' && p.onGround && p.y + p.h < GROUND - 1) p.drop = 0.22;
  else if (a === 'ex') fireEX();
  else if (a === 'super') fireSuper();
  else if (a === 'swap') { p.weapon = (p.weapon + 1) % WEAPONS.length; popup(WEAPONS[p.weapon].name, p.x + p.w / 2, p.y - 20, '#9ef', 22); }
}
function tryJump() {
  const p = player;
  if (p.onGround || p.coyote > 0) { p.vy = -820; p.onGround = false; p.coyote = 0; p.jumps = 1; dust(p.x + p.w / 2, p.y + p.h, 5, 10); return; }
  if (tryParry()) return;
  p.parryWin = 0.15;

  // shadow on whatever surface is below
  let surf = GROUND;
  for (const pl of PLATS) if (p.x + p.w > pl.x && p.x < pl.x + pl.w && pl.y >= p.y + p.h - 1 && pl.y < surf) surf = pl.y;
  const sk = clamp(1 - (surf - p.y - p.h) / 300, 0.3, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(p.x + p.w / 2, surf + 2, 16 * sk, 5 * sk, 0, 0, 7); ctx.fill();
  for (const a of p.after) { // dash afterimages
    ctx.globalAlpha = a.a; ctx.fillStyle = '#7fd7ff';
    ctx.beginPath(); ctx.roundRect(a.x + 2, a.y + 18, p.w - 4, p.h - 18, 8); ctx.fill();
    ctx.beginPath(); ctx.arc(a.x + p.w / 2, a.y + 12, 13, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (p.superT > 0) drawSuperBeam();
  if (p.inv > 0 && p.superT <= 0 && Math.floor(p.inv * 20) % 2) return;

  ctx.save();
  ctx.translate(p.x + p.w / 2, p.y + p.h);
  ctx.scale(p.face, 1);
  if (p.spin > 0) { ctx.translate(0, -28); ctx.rotate((1 - p.spin / 0.35) * Math.PI * 2); ctx.translate(0, 28); }
  if (p.dashT > 0) ctx.rotate(0.18);
  const air = !p.onGround, swing = Math.sin(p.anim) * 7, bob = p.onGround ? Math.abs(Math.sin(p.anim)) * 2 : 0;
  ctx.lineWidth = 3; ctx.strokeStyle = '#000';
  ctx.fillStyle = '#2b2b2b';
  if (air) { ctx.fillRect(-10, -14, 8, 9); ctx.fillRect(2, -16, 8, 9); }
  else { ctx.fillRect(-9 + swing * 0.6, -12, 8, 12); ctx.fillRect(1 - swing * 0.6, -12, 8, 12); }
  ctx.translate(0, -bob);
  // scarf tail
  ctx.fillStyle = '#f4a261';
  ctx.beginPath(); ctx.moveTo(-8, -37); ctx.quadraticCurveTo(-22, -38 + Math.sin(T * 12) * 4, -30, -30 + Math.sin(T * 10) * 5); ctx.lineTo(-26, -27); ctx.quadraticCurveTo(-18, -32, -8, -32); ctx.fill(); ctx.stroke();
  // body
  ctx.fillStyle = '#d62828'; ctx.beginPath(); ctx.roundRect(-13, -37, 26, 26, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#a4161a'; ctx.fillRect(-11, -18, 22, 5);
  // gun arm (follows aim)
  const a = aimAngle(), local = Math.atan2(Math.sin(a), Math.cos(a) * p.face);
  ctx.save(); ctx.translate(4, -27); ctx.rotate(local);
  ctx.fillStyle = '#555'; ctx.beginPath(); ctx.roundRect(0, -5, 24, 10, 3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#7fd7ff'; ctx.fillRect(16, -3, 6, 6);
  if (p.muzzle > 0) drawGlow(30, 0, 22, '#bff0ff', 1);
  ctx.restore();
  // head
  ctx.fillStyle = '#ffd6a5'; ctx.beginPath(); ctx.arc(0, -49, 14, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#3b2414'; ctx.beginPath(); ctx.arc(-3, -60, 9, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-6, -64); ctx.lineTo(-14, -70); ctx.lineTo(-1, -66); ctx.fill();
  if (p.blink > 0) { ctx.fillStyle = '#fff'; ctx.fillRect(1, -54, 6, 9); ctx.fillRect(-7, -54, 6, 9); ctx.fillStyle = '#000'; ctx.fillRect(4, -52, 3, 6); ctx.fillRect(-4, -52, 3, 6); }
  else { ctx.fillStyle = '#000'; ctx.fillRect(-7, -49, 14, 2); }
  ctx.fillStyle = '#f4a261'; ctx.fillRect(-13, -39, 26, 6);
  ctx.restore();
}
function drawSuperBeam() {
  const r = superBeamRect(), cy = r.y + r.h / 2;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(127,215,255,0.35)'; ctx.fillRect(r.x, r.y - 14, r.w, r.h + 28);
  ctx.fillStyle = 'rgba(255,246,199,0.8)'; ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#fff'; ctx.fillRect(r.x, cy - r.h / 5, r.w, r.h / 2.5);
  drawGlow(player.face > 0 ? r.x : r.x + r.w, cy, 80, '#fff6c7', 1);
}
function drawPShots() {
  for (const s of pShots) {
    if (s.ex) { drawGlow(s.x, s.y, 46, '#ffd23f', 1); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, 12, 0, 7); ctx.fill(); continue; }
    const a = Math.atan2(s.vy, s.vx);
    drawGlow(s.x, s.y, s.size * 2.5, s.color, 0.7);
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(a);
    ctx.fillStyle = s.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, s.size * 2, s.size * 0.75, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}
function drawParticles() {
  for (const p of particles) {
    const k = p.life / p.max;
    if (p.kind === 'spark') drawGlow(p.x, p.y, p.size * 3 * (0.5 + k * 0.5), p.color, k);
    else if (p.kind === 'dust') { ctx.globalAlpha = k * 0.6; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.6 - k * 0.6), 0, 7); ctx.fill(); }
    else if (p.kind === 'ring') { ctx.globalAlpha = k; ctx.strokeStyle = p.color; ctx.lineWidth = 5 * k + 1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 - k) + 4, 0, 7); ctx.stroke(); }
    else if (p.kind === 'bit') { ctx.globalAlpha = Math.min(1, k * 2); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    else if (p.kind === 'chunk') { ctx.globalAlpha = Math.min(1, k * 1.5); ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.drawImage(p.img, p.sx, p.sy, p.sw, p.sh, -p.sw / 2, -p.sh / 2, p.sw, p.sh); ctx.restore(); }
    else if (p.kind === 'text') { ctx.globalAlpha = Math.min(1, k * 2); text(p.text, p.x, p.y, p.size, p.color, 'center', 5); }
    ctx.globalAlpha = 1;
  }
  for (const g of drawGlowLater) drawGlow(...g, 0.9);
  drawGlowLater.length = 0;
}

function drawHud() {
  const p = player, b = boss;
  // HP card
  ctx.fillStyle = p.hp === 1 ? (Math.floor(T * 4) % 2 ? '#e63946' : '#fff') : '#fff';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(16, 14, 78, 36, 6); ctx.fill(); ctx.stroke();
  text(`HP. ${Math.max(0, p.hp)}`, 55, 33, 22, '#000', 'center', 0);
  // super meter cards
  for (let i = 0; i < 5; i++) {
    const f = clamp(p.meter - i, 0, 1), x = 104 + i * 24, y = 16 + (f >= 1 ? Math.sin(T * 6 + i) * 2 : 0);
    ctx.fillStyle = '#2a2a2a'; ctx.beginPath(); ctx.roundRect(x, y, 20, 30, 3); ctx.fill();
    if (f > 0) { ctx.fillStyle = f >= 1 ? '#ffd23f' : '#b8902a'; ctx.fillRect(x, y + 30 * (1 - f), 20, 30 * f); }
    ctx.strokeStyle = f >= 1 ? '#fff' : '#000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x, y, 20, 30, 3); ctx.stroke();
    if (f >= 1) drawGlow(x + 10, y + 15, 18, '#ffd23f', 0.5);
  }
  text(WEAPONS[p.weapon].name, 18, 64, 14, '#fff', 'left', 4);
  if (p.meter >= 5) text(touchUI ? 'SUPER READY!' : 'SUPER READY! (F)', 104, 64, 14, '#ffd23f', 'left', 4);
  // boss bar with phase notches
  const pct = Math.max(0, b.hp / b.maxHp), bx = W / 2 - 220;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.roundRect(bx - 4, 12, 448, 20, 6); ctx.fill();
  ctx.fillStyle = theme.c[0]; ctx.fillRect(bx, 16, 440 * pct, 12);
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(bx, 16, 440 * pct, 4);
  ctx.fillStyle = '#000'; ctx.fillRect(bx + 440 * 0.33 - 1, 14, 3, 16); ctx.fillRect(bx + 440 * 0.66 - 1, 14, 3, 16);
  text(b.data.name.toUpperCase(), W / 2, 46, 18, '#fff', 'center', 5);
  text(`BOSS ${wins + 1}`, W - 18, 32, 20, '#fff', 'right', 5);
  if (p.hurtFlash > 0) { ctx.globalAlpha = p.hurtFlash; ctx.fillStyle = '#ff0000'; ctx.drawImage(vignC, 0, 0); ctx.globalCompositeOperation = 'source-atop'; ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; }
}
function drawTouchControls() {
  const s = touch.stick, bx = s ? s.ox : 140, by = s ? s.oy : H - 120;
  ctx.globalAlpha = s ? 0.5 : 0.22;
  ctx.fillStyle = '#000'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(bx, by, 62, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s ? clamp(s.x, bx - 62, bx + 62) : bx, s ? clamp(s.y, by - 62, by + 62) : by, 26, 0, 7); ctx.fill();
  for (const b of BTNS) {
    if (b.show && !b.show()) continue;
    const off = b.a === 'ex' && player.meter < 1;
    ctx.globalAlpha = off ? 0.2 : b.down ? 0.75 : 0.42;
    ctx.fillStyle = b.a === 'super' ? '#ffd23f' : b.a === 'jump' ? '#7fd7ff' : '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.globalAlpha = off ? 0.4 : 0.95; text(b.label, b.x, b.y + 2, b.r * 0.5, '#000', 'center', 0);
  }
  ctx.globalAlpha = 1;
}
function drawButton(r, label, fill, color) {
  ctx.fillStyle = fill; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 12); ctx.fill(); ctx.stroke();
  text(label, r.x + r.w / 2, r.y + r.h / 2 + 3, r.h * 0.55, color, 'center', 0);
}
function drawMenu() {
  ctx.fillStyle = '#1c1712'; ctx.fillRect(0, 0, W, H);
  text('BOSS RUSH', W / 2, 170, 100, '#f6e7c1', 'center', 10);
  drawButton(PLAY_BTN, 'PLAY', '#f6e7c1', '#1c1712');
  text(`${bosses.length} boss${bosses.length === 1 ? '' : 'es'}  ·  best streak ${best}`, W / 2, 410, 20, '#a89a80', 'center', 0);
  if (touchUI) text('Left thumb: move & aim  ·  Buttons: jump, dash, EX  ·  Auto-fire', W / 2, 480, 18, '#6f6555', 'center', 0);
  else {
    text('A/D move · W aim up · Space jump (x2) · J or click shoot · Shift dash', W / 2, 470, 17, '#6f6555', 'center', 0);
    text('E: EX shot · F: super · Q: swap gun · S: drop · jump into PINK to parry', W / 2, 498, 17, '#6f6555', 'center', 0);
  }
}

function draw(portrait) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (portrait) {
    ctx.fillStyle = '#1c1712'; ctx.fillRect(0, 0, W, H);
    text('ROTATE YOUR PHONE', W / 2, H / 2 - 20, 60, '#f6e7c1', 'center', 8);
    text('This game plays sideways', W / 2, H / 2 + 40, 26, '#a89a80', 'center', 0);
    return;
  }
  if (state === 'loading') { ctx.fillStyle = '#1c1712'; ctx.fillRect(0, 0, W, H); text('LOADING...', W / 2, H / 2, 44); return; }
  if (state === 'menu') { drawMenu(); return; }

  if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawStage();
  drawWarnings();
  drawBossShadow();
  drawBoss();
  drawMinions();
  drawEShots();
  if (state !== 'dead') drawPlayer();
  drawPShots();
  drawParticles();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(vignC, 0, 0);
  if (player.hurtFlash > 0) { ctx.globalAlpha = player.hurtFlash * 0.5; ctx.fillStyle = '#ff2020'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  drawHud();
  if (touchUI && state === 'fight') drawTouchControls();

  const c1 = theme.c[0];
  if (state === 'intro' && boss.lift === 0) {
    if (stateT < 2.6) {
      const slide = Math.min(1, (stateT - 0.6) * 3);
      if (slide > 0) {
        ctx.fillStyle = `rgba(0,0,0,${0.65 * slide})`; ctx.fillRect(0, 150, W, 200);
        const ox = (1 - slide) * -W;
        text(boss.data.name.toUpperCase(), W / 2 + ox, 205, 68, c1, 'center', 9);
        text(boss.data.title, W / 2 - ox, 262, 30);
        text(`"${boss.data.taunt}"`, W / 2 + ox, 310, 21, '#ddd', 'center', 4);
      }
    } else text('FIGHT!', W / 2, H / 2 - 40, 110 + (stateT - 2.6) * 60, '#ffd23f', 'center', 10);
  }
  if (banner) text(banner.text, W / 2, H / 2 - 60, Math.min(90, banner.t * 500), '#ff3b3b', 'center', 10);
  if (state === 'ko') text('KNOCKOUT!', W / 2, H / 2 - 40, Math.min(120, 30 + stateT * 300), '#ffd23f', 'center', 10);
  if (state === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);
    text('YOU DIED!', W / 2, 150, 92, '#e63946', 'center', 10);
    text(`${boss.data.name} wins this round`, W / 2, 225, 26);
    const prog = 1 - boss.hp / boss.maxHp;
    ctx.fillStyle = '#333'; ctx.fillRect(W / 2 - 220, 270, 440, 20);
    ctx.fillStyle = c1; ctx.fillRect(W / 2 - 220, 270, 440 * prog, 20);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(W / 2 - 220, 270, 440, 20);
    text(`${Math.round(prog * 100)}% there  ·  streak ${wins}`, W / 2, 322, 22, '#ccc', 'center', 0);
    if (stateT > 0.8) { drawButton(RETRY_BTN, 'RETRY', '#f6e7c1', '#1c1712'); drawButton(MENU_BTN, 'MENU', '#6f6555', '#f6e7c1'); }
  }
  if (flashA > 0) { ctx.globalAlpha = flashA; ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  const portrait = touchUI && innerHeight > innerWidth;
  if (!portrait) {
    T += dt;
    if (hitstop > 0) hitstop -= dt; else update(dt);
    flashA = Math.max(0, flashA - dt * 2.5);
  }
  draw(portrait);
  requestAnimationFrame(frame);
}
document.fonts.load(`20px ${FONT}`).finally(() => loadBosses().then(() => state = 'menu'));
requestAnimationFrame(frame);
</script>
</body>
</html>
